<!DOCTYPE html>
<html lang="en">
<head>

<title>Binance Clone - Navbar</title>
<link rel="stylesheet" href="https://cloudflare.com">
<link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">

    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">

        <a href="#">Earn <i class="arrow">▾</i></a>

      <li>

      </li>

        <a href="#">More <i class="arrow">▾</i></a>
      </li>
    </ul>
  </div>

  <div class="nav-right">
    <i class="icon">🔍</i>
    <button class="btn btn-outline">Log In</button>

    <i class="icon">⬇️</i>
